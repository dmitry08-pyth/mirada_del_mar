{% extends "base.html" %}

{% block title %}Вход в аккаунт — Mirada Del Mar{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>Вход в аккаунт</h1>
    <p class="auth-subtitle">Войдите, чтобы управлять бронированиями и оставлять отзывы</p>

    {% if error %}
      <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post" class="auth-form">
      <div class="form-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" name="email" placeholder="Введите почту" required>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль" required>
      </div>

      <button type="submit" class="auth-submit-btn">Войти</button>
    </form>

    <div class="auth-footer">
      Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
  </div>
</section>
{% endblock %}
