{% extends "base.html" %}

{% block title %}Регистрация — Mirada Del Mar{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт гостя Mirada Del Mar</p>

    {% if error %}
      <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form action="/register" method="post" class="auth-form">
      <div class="form-group">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="name" placeholder="Ваше имя" required>
      </div>

      <div class="form-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" name="email" placeholder="Введите почту" required>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Придумайте пароль" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="password_confirm">Повторите пароль</label>
        <input type="password" id="password_confirm" name="password_confirm" placeholder="Повторите пароль" minlength="8" required>
      </div>

      <button type="submit" class="auth-submit-btn">Создать аккаунт</button>
    </form>

    <div class="auth-footer">
      Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
  </div>
</section>
{% endblock %}
