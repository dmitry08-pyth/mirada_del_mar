{% extends "base.html" %}

{% block title %}Номера - Mirada Del Mar{% endblock %}

{% block content %}
<!-- ОПИСАНИЕ -->
    <section class="page-intro">
      <h1>Номера</h1>
      <p>Продуманный комфорт для каждого гостя. Выберите подходящую категорию номера для подробного ознакомления.</p>
    </section>

    <!-- КАТЕГОРИИ НОМЕРОВ -->
    <section class="catalog-section">
      <div class="catalog-grid">
        <a href="/rooms/eco-room" class="catalog-card">
          <div class="catalog-img-box">
            <img src="/static/images/rooms/eco_room/eco-room-1.jpg" alt="Эконом номер">
          </div>
          <h3 class="catalog-title">Эконом номер</h3>
        </a>

        <a href="/rooms/comfort-room" class="catalog-card">
          <div class="catalog-img-box">
            <img src="/static/images/rooms/comfort_room/comfort-room-1.jpg" alt='Номер "Комфорт"'>
          </div>
          <h3 class="catalog-title">Номер "Комфорт"</h3>
        </a>

        <a href="/rooms/family-room" class="catalog-card">
          <div class="catalog-img-box">
            <img src="/static/images/rooms/family_room/family-room-1.jpg" alt="Семейный номер">
          </div>
          <h3 class="catalog-title">Семейный номер</h3>
        </a>

        <a href="/rooms/garden-chalet" class="catalog-card">
          <div class="catalog-img-box">
            <img src="/static/images/rooms/garden_chalet/garden-chalet-1.jpg" alt="Garden Chalet">
          </div>
          <h3 class="catalog-title">Garden Chalet</h3>
        </a>
      </div>
    </section>
{% endblock %}
