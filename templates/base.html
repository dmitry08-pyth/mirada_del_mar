<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mirada Del Mar{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header id="site-header">
    <a href="/" class="logo">
      <img src="/static/images/mirada-del-mar-logo.jpg" alt="Mirada Del Mar">
    </a>

    <nav class="nav-menu">
      <a href="/rooms">Номера</a>
      <a href="/gastronomy">Гастрономия</a>
      <a href="/beach-and-pools">Пляж и бассейны</a>
      <a href="/spa">СПА</a>
      <a href="/kids">Дети</a>
      <a href="/activities">Активности</a>
    </nav>

    <div class="header-actions">
      <a href="/reviews" class="nav-btn-primary">Отзывы</a>
      <a href="/booking" class="nav-btn-secondary">Бронирование</a>

      {% if current_user %}
        <a href="/profile" class="account-btn is-logged-in" title="Личный кабинет">
          <img src="{{ current_user.avatar or '/static/images/avatars/default-avatar.jpg' }}" alt="Профиль" class="account-avatar">
          <span class="account-label">{{ current_user.name }}</span>
        </a>
      {% else %}
        <a href="/login" class="account-btn" title="Войти в аккаунт">
          <img src="/static/images/avatars/default-avatar.jpg" alt="Гость" class="account-avatar">
          <span class="account-label">Гость</span>
        </a>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
